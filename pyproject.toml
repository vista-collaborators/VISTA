[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista"
version = "0.1.0"
description = "VISTA: Vision-based Intelligent System for Treatment of Anti-VEGF."
requires-python = ">=3.9"
dependencies = [
  "torch",
  "torchvision",
  "pandas",
  "openpyxl",
  "PyYAML",
  "Pillow",
]

[tool.setuptools.packages.find]
include = ["vista*"]

[tool.setuptools.package-data]
"vista.dinov3" = ["LICENSE.md"]
